services:
  supportmanagement:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=local-es
      - spring.datasource.url=jdbc:mariadb://mariadb:3306/supportmanagement
      - spring.datasource.username=root
      - spring.datasource.password=root
      - OPENSEARCH_URIS=http://elasticsearch:9200
      - elasticsearch.reindex.on-startup=true
    ports:
      - "8080:8080"
    # Cap the container so MaxRAMPercentage=75 sizes the JVM against this limit instead of the whole VM
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mariadb:
    image: mariadb:10.6
    # swedish_ci matches the production dump's collation — without it, migrations applied on top of the
    # dump create tables with the container default collation and foreign keys across the two fail (errno 150)
    command: --max-allowed-packet=256M --innodb-buffer-pool-size=512M --innodb-log-file-size=256M --character-set-server=utf8mb4 --collation-server=utf8mb4_swedish_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: supportmanagement
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service keeps the name "elasticsearch" so run-poc.sh and the app config work unchanged,
  # but runs OpenSearch (same 9200 API surface, security plugin disabled for the PoC)
  elasticsearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      # The performance analyzer agent is a second JVM inside the container and costs several
      # hundred MB - not needed for the PoC
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      # 512m heap is plenty for ~70k small documents; the full OpenSearch plugin bundle needs the
      # rest of the limit as native/plugin overhead (1g heap got the container cgroup-OOM-killed)
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: opensearchproject/opensearch-dashboards:3.2.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOSTS=["http://elasticsearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    mem_limit: 384m
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mariadb-data:
  es-data:
