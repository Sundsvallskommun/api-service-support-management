    patch:
      tags:
        - Conversation resource
      description: Update a conversation
      operationId: updateConversation
      parameters:
        - name: municipalityId
          in: path
          description: Municipality ID
          required: true
          schema:
            type: string
          example: 2281
        - name: namespace
          in: path
