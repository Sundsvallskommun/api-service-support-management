  /{municipalityId}/{namespace}/conversations/{conversationId}/countReadBy:
    get:
      tags:
        - Conversation resource
      description: "Get read statistics for a conversation, describing how many messages\
        \ have been read per identifier and per part."
      operationId: countReadBy
      parameters:
        - name: municipalityId
          in: path
          description: Municipality ID
          required: true
          schema:
            type: string
          example: 2281
        - name: namespace
          in: path
          description: Namespace
          required: true
          schema:
            type: string
          example: MY_NAMESPACE
        - name: conversationId
          in: path
          description: Conversation ID
          required: true
          schema:
            type: string
          example: b82bd8ac-1507-4d9a-958d-369261eecc15
        - name: includeSystemMessages
          in: query
          description: Whether system generated messages should be included in the statistics.
            Defaults to false.
          required: false
          schema:
            type: boolean
            default: false
          example: false
      responses:
        "200":
          description: OK - Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadByStatistics"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
