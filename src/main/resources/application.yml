scheduler:
  emailreader:
    name: fetch_emails
    cron: 0 */5 * * * *
    shedlock-lock-at-most-for: PT10M
    maximum-execution-time: PT5M
  web-message-collector:
    name: fetch_webMessages
    cron: 15 */5 * * * *
    shedlock-lock-at-most-for: PT10M
    maximum-execution-time: PT5M
  notification:
    name: clean_notifications
    cron: 0 0 0 * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  suspension:
    name: clean_suspensions
    cron: 0 */2 * * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  messageexchange:
    name: message_exchange
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT2M
    maximum-execution-time: PT1M
  action:
    name: process_actions
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  notification-dispatch:
    name: process_notification_dispatch
    cron: 0 */5 * * * *
    shedlock-lock-at-most-for: PT9M
    maximum-execution-time: PT4M
    transaction-buffer: PT10S
    max-age: P30D
  attachment-hash:
    name: compute_attachment_hash
    enabled: true
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT15M
    maximum-execution-time: PT5M
    batch-size: 250
  process-event:
    name: process_event_relay
    cron: 0 * * * * *
    shedlock-lock-at-most-for: PT2M
    maximum-execution-time: PT1M
    # How old a row must be before the scheduled run takes it, so that the run does not reach past a transaction still
    # being committed. The direct run is not held to it, since it starts once its own transaction is committed
    transaction-buffer: PT5S
    # Last resort for a row that never makes it through
    max-age: P30D
    # Measured on the age of the oldest undelivered row
    unhealthy-after: PT15M
    # Ceiling per run, so that a backlog cannot make a single run unbounded
    batch-size: 200
  process-cleanup:
    name: process_event_cleanup
    cron: 0 30 2 * * *
    shedlock-lock-at-most-for: PT10M
    maximum-execution-time: PT5M
    batch-size: 1000
    # How long an entry of the activity log is kept
    activity-retention: P365D
  job:
    name: maintain_jobs
    # Hourly. What the sweep looks for is a job that has been quiet for days, so asking more often than that finds the
    # same nothing over and over - and an hour is neither here nor there next to the patience it is measured against.
    cron: 0 0 * * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
errand:
  # Settings for the retention purge. Documented in ErrandPurgeProperties, which is where the defaults live.
  purge:
    minimum-age: P2Y
    batch-size: 250
    max-concurrent-runs: 2
    progress-interval: PT1M
process-engine:
  # Settings for the process engine errand events are published to. Documented in ProcessEngineProperties, which is where
  # the defaults live.
  loop-guard:
    max-events-per-errand: 20
    window: PT10M
  direct-run:
    enabled: true
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 500
job:
  # Settings for the job table every long running piece of work reports against. Documented in JobProperties, which is
  # where the defaults live. Jobs are kept: a purge leaves one row behind, and that row is the lasting record of it.
  stale-after: PT30M
integration:
  accessmapper:
    connectTimeout: 5
    readTimeout: 30
  emailreader:
    connectTimeout: 5
    readTimeout: 30
  eventlog:
    connectTimeout: 5
    readTimeout: 30
  employee:
    connect-timeout: 5
    read-timeout: 30
  messaging:
    connectTimeout: 5
    readTimeout: 30
  messageexchange:
    connectTimeout: 5
    readTimeout: 30
  messaging-settings:
    connect-timeout: 5
    read-timeout: 30
  notes:
    connectTimeout: 5
    readTimeout: 30
  web-message-collector:
    connectTimeout: 5
    readTimeout: 30
  citizen:
    connect-timeout: 5
    read-timeout: 30
  relation:
    connect-timeout: 5
    read-timeout: 30
  json-schema:
    connectTimeout: 5
    readTimeout: 30
  pw-alkt:
    # Short on purpose: the call is held inside the transaction of the delivery, and pw-alkt answers as soon as it has
    # taken the event in
    connect-timeout: 5
    read-timeout: 10
logbook:
  body-filters:
    jsonPath:
      - key: '$..base64EncodedString'
        value: '[base64]'
      - key: '$..attachments[*].content'
        value: '[binary]'
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
resilience4j:
  circuitbreaker:
    instances:
      messaging:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      relation:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      json-schema:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      pw-alkt:
        # An answer about a single event, a 5xx included, says pw-alkt is there and is not counted: counting it would let a
        # few events pw-alkt never takes hold the breaker open for every errand. Everything else is counted - a timeout, a
        # connection that fails, a token that cannot be fetched
        ignoreExceptions:
          - se.sundsvall.dept44.exception.ClientProblem
          - se.sundsvall.dept44.exception.ServerProblem
        # Opens once three calls are counted and half of the last five failed. The token retryer every client is given makes a timeout twice
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        waitDurationInOpenState: PT30S

spring:
  application:
    name: support-management
  cache:
    cache-names: namespaceConfigCache, accessibleLabelsCache
    caffeine:
      # default setting used if no override has been defined
      spec: maximumSize=200, expireAfterWrite=10m
      # overriding of default setting for specific caches
      spec-overrides:
        - cache-name: accessibleLabelsCache
          spec: maximumSize=1000, expireAfterWrite=15m
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
  security:
    oauth2:
      client:
        registration:
          accessmapper:
            authorization-grant-type: client_credentials
            provider: accessmapper
          emailreader:
            authorization-grant-type: client_credentials
            provider: emailreader
          employee:
            authorization-grant-type: client_credentials
            provider: employee
          eventlog:
            authorization-grant-type: client_credentials
            provider: eventlog
          messaging:
            authorization-grant-type: client_credentials
            provider: messaging
          messageexchange:
            authorization-grant-type: client_credentials
            provider: messageexchange
          messaging-settings:
            authorization-grant-type: client_credentials
            provider: messaging-settings
          notes:
            authorization-grant-type: client_credentials
            provider: notes
          web-message-collector:
            authorization-grant-type: client_credentials
            provider: web-message-collector
          citizen:
            authorization-grant-type: client_credentials
            provider: citizen
          relation:
            authorization-grant-type: client_credentials
            provider: relation
          json-schema:
            authorization-grant-type: client_credentials
            provider: json-schema
          pw-alkt:
            authorization-grant-type: client_credentials
            provider: pw-alkt
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: -1
turkraft:
  springfilter:
    offsetdatetimeformatter:
      pattern: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

semaphore:
  maxMemoryUsage: 262100000
