scheduler:
  emailreader:
    name: fetch_emails
    cron: 0 */5 * * * *
    shedlock-lock-at-most-for: PT10M
    maximum-execution-time: PT5M
  web-message-collector:
    name: fetch_webMessages
    cron: 15 */5 * * * *
    shedlock-lock-at-most-for: PT10M
    maximum-execution-time: PT5M
  notification:
    name: clean_notifications
    cron: 0 0 0 * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  suspension:
    name: clean_suspensions
    cron: 0 */2 * * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  messageexchange:
    name: message_exchange
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT2M
    maximum-execution-time: PT1M
  action:
    name: process_actions
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT4M
    maximum-execution-time: PT2M
  notification-dispatch:
    name: process_notification_dispatch
    cron: 0 */5 * * * *
    shedlock-lock-at-most-for: PT9M
    maximum-execution-time: PT4M
    transaction-buffer: PT10S
    max-age: P30D
  attachment-hash:
    name: compute_attachment_hash
    enabled: true
    cron: 0 */1 * * * *
    shedlock-lock-at-most-for: PT15M
    maximum-execution-time: PT5M
    batch-size: 250
elasticsearch:
  enabled: false
  reindex:
    on-startup: false
integration:
  accessmapper:
    connectTimeout: 5
    readTimeout: 30
  emailreader:
    connectTimeout: 5
    readTimeout: 30
  eventlog:
    connectTimeout: 5
    readTimeout: 30
  employee:
    connect-timeout: 5
    read-timeout: 30
  messaging:
    connectTimeout: 5
    readTimeout: 30
  messageexchange:
    connectTimeout: 5
    readTimeout: 30
  messaging-settings:
    connect-timeout: 5
    read-timeout: 30
  notes:
    connectTimeout: 5
    readTimeout: 30
  web-message-collector:
    connectTimeout: 5
    readTimeout: 30
  citizen:
    connect-timeout: 5
    read-timeout: 30
  relation:
    connect-timeout: 5
    read-timeout: 30
  json-schema:
    connectTimeout: 5
    readTimeout: 30
logbook:
  body-filters:
    jsonPath:
      - key: '$..base64EncodedString'
        value: '[base64]'
      - key: '$..attachments[*].content'
        value: '[binary]'
logging:
  level:
    root: INFO
management:
  health:
    # Boot's Elastic health indicator rides along transitively via spring-data-opensearch-starter and
    # probes spring.elasticsearch.uris' default localhost:9200 - it must never fail readiness
    elasticsearch:
      enabled: false
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
resilience4j:
  circuitbreaker:
    instances:
      messaging:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      relation:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      json-schema:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
spring:
  application:
    name: support-management
  data:
    elasticsearch:
      # Boot's elastic repositories autoconfiguration comes transitively via spring-data-opensearch-starter.
      # Repository bootstrap (index creation) is activated explicitly by ElasticsearchConfiguration when
      # elasticsearch.enabled=true
      repositories:
        enabled: false
  cache:
    cache-names: namespaceConfigCache, accessibleLabelsCache
    caffeine:
      # default setting used if no override has been defined
      spec: maximumSize=200, expireAfterWrite=10m
      # overriding of default setting for specific caches
      spec-overrides:
        - cache-name: accessibleLabelsCache
          spec: maximumSize=1000, expireAfterWrite=15m
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
  security:
    oauth2:
      client:
        registration:
          accessmapper:
            authorization-grant-type: client_credentials
            provider: accessmapper
          emailreader:
            authorization-grant-type: client_credentials
            provider: emailreader
          employee:
            authorization-grant-type: client_credentials
            provider: employee
          eventlog:
            authorization-grant-type: client_credentials
            provider: eventlog
          messaging:
            authorization-grant-type: client_credentials
            provider: messaging
          messageexchange:
            authorization-grant-type: client_credentials
            provider: messageexchange
          messaging-settings:
            authorization-grant-type: client_credentials
            provider: messaging-settings
          notes:
            authorization-grant-type: client_credentials
            provider: notes
          web-message-collector:
            authorization-grant-type: client_credentials
            provider: web-message-collector
          citizen:
            authorization-grant-type: client_credentials
            provider: citizen
          relation:
            authorization-grant-type: client_credentials
            provider: relation
          json-schema:
            authorization-grant-type: client_credentials
            provider: json-schema
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: -1
turkraft:
  springfilter:
    offsetdatetimeformatter:
      pattern: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

semaphore:
  maxMemoryUsage: 262100000
